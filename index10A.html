<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    @page {
        size: 108mm 192mm;
        margin: 10mm 8mm;
        background-color: #0d1117;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
        color: #c9d1d9;
        background-color: #0d1117;
        font-size: 13px;
        line-height: 1.5;
        padding: 4px;
    }
    .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
        border-bottom: 1px solid #21262d;
        padding-bottom: 12px;
        margin-bottom: 16px;
    }
    .header .badge {
        display: inline-block;
        background: rgba(56, 189, 248, 0.12);
        color: #38bdf8;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
    }
    .header h1 {
        font-size: 18px;
        font-weight: 700;
        color: #f0f6fc;
        letter-spacing: 0.5px;
    }
    .item-list {
        margin-bottom: 16px;
    }
    .item {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 10px;
    }
    .item-row-1 {
        display: table;
        width: 100%;
        margin-bottom: 6px;
    }
    .item-name {
        display: table-cell;
        font-size: 14px;
        font-weight: 600;
        color: #f0f6fc;
        text-align: left;
    }
    .item-hours {
        display: table-cell;
        font-size: 15px;
        font-weight: 700;
        color: #38bdf8;
        text-align: right;
        white-space: nowrap;
    }
    .item-row-2 {
        display: table;
        width: 100%;
        font-size: 12px;
        color: #8b949e;
    }
    .meta-label {
        display: table-cell;
        text-align: left;
    }
    .meta-code {
        display: table-cell;
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        color: #58a6ff;
        background: #161b22;
        border: 1px solid #30363d;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 600;
    }
    .total-card {
        background: linear-gradient(145deg, #1f2937 0%, #111827 100%);
        border: 1px solid #38bdf8;
        border-radius: 8px;
        padding: 14px 16px;
        display: table;
        width: 100%;
    }
    .total-title {
        display: table-cell;
        vertical-align: middle;
        font-size: 14px;
        font-weight: 600;
        color: #e5e7eb;
        text-align: left;
    }
    .total-amount {
        display: table-cell;
        vertical-align: middle;
        text-align: right;
        font-size: 22px;
        font-weight: 800;
        color: #38bdf8;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="badge">工時請款單</div>
            <h1>引擎蓋與噴漆明細</h1>
        </div>

        <div class="item-list">
            <!-- 項目 1 -->
            <div class="item">
                <div class="item-row-1">
                    <span class="item-name">引擎蓋</span>
                    <span class="item-hours">2.60 h</span>
                </div>
                <div class="item-row-2">
                    <span class="meta-label">項目代碼</span>
                    <span class="meta-code">79E1KV</span>
                </div>
            </div>

            <!-- 項目 2 -->
            <div class="item">
                <div class="item-row-1">
                    <span class="item-name">金屬漆 / 清漆 (兩層) <span style="font-size: 11px; color: #8b949e; font-weight: normal;">(+1.00h)</span></span>
                    <span class="item-hours">1.00 h</span>
                </div>
                <div class="item-row-2">
                    <span class="meta-label">項目代碼</span>
                    <span class="meta-code">70E01U</span>
                </div>
            </div>
        </div>

        <!-- 總計 -->
        <div class="total-card">
            <div class="total-title">總請款工時</div>
            <div class="total-amount">3.60 h</div>
        </div>
    </div>
</body>
</html>
