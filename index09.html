<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行動版車管級郵件聯絡人系統</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --panel-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 頂部系統標題卡片 */
        .sys-header-card {
            background: #0f172a;
            color: #ffffff;
            padding: 18px 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sys-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .sys-subtitle {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 組織部門切換折疊區 */
        .accordion-box {
            background: var(--panel-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .accordion-toggle {
            padding: 12px 16px;
            background: #f1f5f9;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .accordion-content {
            display: none;
            padding: 12px;
            background: #fff;
            gap: 6px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-color);
        }
        .accordion-content.show {
            display: flex;
        }
        .dept-chip {
            padding: 6px 12px;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dept-chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 搜尋與地區快速 Pills 篩選列 */
        .filter-section {
            background: var(--panel-bg);
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            gap: 8px;
        }
        .search-input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            width: 100%;
            color: var(--text-main);
        }
        .quick-pills {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .quick-pills::-webkit-scrollbar { display: none; }
        .pill-tag {
            padding: 6px 14px;
            background: #f1f5f9;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .pill-tag.active {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }

        /* 批量操作工具列 */
        .batch-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            padding: 0 4px;
        }
        .batch-btns {
            display: flex;
            gap: 8px;
        }
        .btn-mini {
            padding: 4px 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
        }

        /* 手機版卡片清單區 */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .contact-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            position: relative;
            border-left: 4px solid transparent;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s;
        }
        .contact-card.selected {
            background-color: var(--primary-light);
            border-color: var(--primary);
            border-left: 4px solid var(--primary);
        }
        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }
        .card-badge {
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .card-email {
            font-size: 12px;
            color: var(--text-muted);
        }
        .card-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* 底部郵件與罐頭訊息組合面板 */
        .composer-card {
            background: var(--panel-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }
        .section-heading {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .template-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .template-scroll::-webkit-scrollbar { display: none; }
        .template-chip {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .template-chip:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            font-family: inherit;
            background: #fff;
        }
        .form-group textarea {
            resize: none;
            height: 90px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-send {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.2);
        }
        .btn-send:active { background: #16a34a; }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-sub {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .btn-copy-rec { background: var(--primary); color: #fff; border: none; }
        .btn-copy-all { background: #f1f5f9; color: var(--text-main); }
    </style>
</head>
<body>

    <!-- 頂部卡片 -->
    <div class="sys-header-card">
        <div class="sys-title-row">
            <span>📧 行動通訊郵件聯絡系統</span>
        </div>
        <div class="sys-subtitle">跨部門快速選人與協同發送監控</div>
    </div>

    <!-- 組織部門折疊篩選列 -->
    <div class="accordion-box">
        <div class="accordion-toggle" onclick="toggleAccordion()">
            <span>📂 組織架構篩選（目前：<span id="currentDeptLabel">全部名單</span>）</span>
            <span id="arrowIcon">▼</span>
        </div>
        <div class="accordion-content" id="accordionContent">
            <div class="dept-chip active" onclick="selectDept('ALL', this)">全部名單</div>
            <div class="dept-chip" onclick="selectDept('高階主管', this)">高階主管</div>
            <div class="dept-chip" onclick="selectDept('財務部', this)">財務部</div>
            <div class="dept-chip" onclick="selectDept('服務廠長', this)">服務廠長</div>
            <div class="dept-chip" onclick="selectDept('各廠出納', this)">各廠出納</div>
            <div class="dept-chip" onclick="selectDept('總代理 PGU', this)">總代理 PGU</div>
        </div>
    </div>

    <!-- 搜尋與快速標籤列 -->
    <div class="filter-section">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="mobileSearch" class="search-input" placeholder="輸入姓名、職稱、Email..." onkeyup="renderMobileCards()">
        </div>
        <div class="quick-pills">
            <div class="pill-tag active" onclick="selectSite('ALL', this)">全部地區</div>
            <div class="pill-tag" onclick="selectSite('北投', this)">北投廠</div>
            <div class="pill-tag" onclick="selectSite('松江', this)">松江廠</div>
            <div class="pill-tag" onclick="selectSite('板橋', this)">板橋廠</div>
            <div class="pill-tag" onclick="selectSite('PGU', this)">PGU</div>
        </div>
    </div>

    <!-- 批量工具列 -->
    <div class="batch-toolbar">
        <span>已選取 <strong id="selectedCount">0</strong> 人</span>
        <div class="batch-btns">
            <button class="btn-mini" onclick="checkAllMobile(true)">全選</button>
            <button class="btn-mini" onclick="checkAllMobile(false)">取消</button>
        </div>
    </div>

    <!-- 卡片清單區 -->
    <div class="cards-container" id="mobileCardsContainer"></div>

    <!-- 底部郵件編輯面板 -->
    <div class="composer-card">
        <div class="section-heading">
            <span>常用罐頭訊息</span>
        </div>
        <div class="template-scroll">
            <div class="template-chip" onclick="loadTemplate('每日內湖廠營運日報表', 'DEAR ALL：\n\n附件檔為營運日報表，煩請查閱。\n如內容有需補充或調整之處，敬請告知，謝謝。')">🚗 營運日報表</div>
            <div class="template-chip" onclick="loadTemplate('【重大通報】營運會議通知', '各位長官、廠長好：\n\n謹定於本週召開營運業務例會，請提前準備報表。')">👑 會議通知</div>
            <div class="template-chip" onclick="loadTemplate('【財務】每日營業報表與查帳', '副總、經理、財務同仁好：\n\n今日各廠營運報表已上傳，請協助審查。')">📊 財務查帳</div>
            <div class="template-chip" onclick="loadTemplate('【帳務】出納零用金核銷', '出納同仁好：\n\n本期臨店零用金結報與廠商建檔明細如附。')">💰 零用金核銷</div>
            <div class="template-chip" onclick="loadTemplate('【PGU 業務】總代理聯繫', 'Dear PGU Team,\n\n檢附本期業務營運文件，請查收附件。')">📩 PGU 聯繫</div>
        </div>

        <div class="form-group" style="margin-top: 4px;">
            <label>郵件主旨</label>
            <input type="text" id="mSubject" placeholder="請填寫主旨或選擇罐頭訊息...">
        </div>
        <div class="form-group">
            <label>郵件內文</label>
            <textarea id="mBody" placeholder="請填寫內文..."></textarea>
        </div>

        <div class="action-buttons">
            <button class="btn-send" onclick="sendMobileEmail()">🚀 立即開啟郵件發送</button>
            <div class="btn-row">
                <button class="btn-sub btn-copy-rec" onclick="copyMobileRecipients()">📋 複製收件人</button>
                <button class="btn-sub btn-copy-all" onclick="copyMobileFull()">📝 複製主旨內文</button>
            </div>
        </div>
    </div>

<script>
    const contactsData = [
        { name: "盧張浩", title: "副董事長", dept: "高階主管", email: "peter@am-volvocars.com.tw" },
        { name: "盧佩伶", title: "董事長室 / 特助", dept: "高階主管", email: "frances@am-volvocars.com.tw" },
        { name: "徐文勇", title: "總經理", dept: "高階主管", email: "william@starunited.tw" },
        { name: "林欣旭", title: "售後總監", dept: "高階主管", email: "george@starunited.tw" },
        { name: "廖宗俊", title: "銷售總監", dept: "高階主管", email: "eric@starunited.tw" },
        { name: "陳永信", title: "CRM 經理", dept: "高階主管", email: "mike_chen@starunited.tw" },
        
        { name: "曹復維", title: "副總經理", dept: "財務部", email: "frank@am-volvocars.com.tw" },
        { name: "林金鑾", title: "財務經理", dept: "財務部", email: "katie@am-volvocars.com.tw" },
        { name: "薛曉芬", title: "每日報表 / 尚鵬查帳", dept: "財務部", email: "Fan_hsueh@am-volvocars.com.tw" },
        { name: "陳宣輔", title: "每日報表 / 尚鵬查帳", dept: "財務部", email: "tom_chen@am-volvocars.com.tw" },
        { name: "Alan", title: "星聯帳款窗口", dept: "財務部", email: "alan_ho@am-volvocars.com.tw" },
        { name: "鄭丞佑", title: "供應商建檔", dept: "財務部", email: "andy_cheng@am-volvocars.com.tw" },

        { name: "陳俊逸", title: "北投廠長", dept: "服務廠長", email: "matt_chen@starunited.tw" },
        { name: "張師誠", title: "松江廠長", dept: "服務廠長", email: "shihcheng@starunited.tw" },
        { name: "陳政威", title: "板橋廠長", dept: "服務廠長", email: "alex_chen@starunited.tw" },

        { name: "劉安莉", title: "出納", dept: "各廠出納", email: "anly_liu@starunited.tw" },
        { name: "張詠婕", title: "出納", dept: "各廠出納", email: "elle_chang@starunited.tw" },
        { name: "陳宥鈺", title: "出納", dept: "各廠出納", email: "tps.nkcrm01@sunpekmotors.com" },

        { name: "翁士航", title: "總代理窗口", dept: "總代理 PGU", email: "austin.weng@pgu.com.tw" },
        { name: "LEE", title: "總代理窗口", dept: "總代理 PGU", email: "lee.lee@pgu.com.tw" },
        { name: "Joseph", title: "總代理窗口", dept: "總代理 PGU", email: "joseph.tseng@pgu.com.tw" },
        { name: "benson", title: "總代理窗口", dept: "總代理 PGU", email: "benson.liu@pgu.com.tw" }
    ];

    let currentDept = 'ALL';
    let currentSite = 'ALL';
    let selectedEmails = new Set();

    window.onload = function() {
        renderMobileCards();
    };

    function toggleAccordion() {
        const content = document.getElementById('accordionContent');
        const arrow = document.getElementById('arrowIcon');
        content.classList.toggle('show');
        arrow.innerText = content.classList.contains('show') ? '▲' : '▼';
    }

    function selectDept(dept, el) {
        currentDept = dept;
        document.getElementById('currentDeptLabel').innerText = dept === 'ALL' ? '全部名單' : dept;
        document.querySelectorAll('.dept-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        toggleAccordion();
        renderMobileCards();
    }

    function selectSite(site, el) {
        currentSite = site;
        document.querySelectorAll('.pill-tag').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderMobileCards();
    }

    function renderMobileCards() {
        const container = document.getElementById('mobileCardsContainer');
        const kw = document.getElementById('mobileSearch').value.toLowerCase().trim();
        container.innerHTML = '';

        const filtered = contactsData.filter(item => {
            const matchDept = (currentDept === 'ALL' || item.dept === currentDept);
            const matchSite = (currentSite === 'ALL' || item.title.includes(currentSite) || item.dept.includes(currentSite));
            const matchKw = !kw || item.name.toLowerCase().includes(kw) || item.title.toLowerCase().includes(kw) || item.email.toLowerCase().includes(kw);
            return matchDept && matchSite && matchKw;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 24px; color: #94a3b8; font-size: 13px;">無符合條件的聯絡人</div>`;
            return;
        }

        filtered.forEach(item => {
            const val = `${item.title}-${item.name} <${item.email}>`;
            const isChecked = selectedEmails.has(val);

            const card = document.createElement('div');
            card.className = `contact-card ${isChecked ? 'selected' : ''}`;
            card.onclick = (e) => toggleCard(card, val);

            card.innerHTML = `
                <div class="card-top-row">
                    <div class="card-name-group">
                        <span class="card-name">${item.name}</span>
                        <span class="card-badge">${item.title}</span>
                    </div>
                    <input type="checkbox" class="card-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); checkboxChanged(this, '${val}')">
                </div>
                <div class="card-email">${item.email}</div>
            `;
            container.appendChild(card);
        });

        document.getElementById('selectedCount').innerText = selectedEmails.size;
    }

    function toggleCard(cardEl, val) {
        const cb = cardEl.querySelector('.card-checkbox');
        cb.checked = !cb.checked;
        updateSelectionState(cb, val, cardEl);
    }

    function checkboxChanged(cb, val) {
        const cardEl = cb.closest('.contact-card');
        updateSelectionState(cb, val, cardEl);
    }

    function updateSelectionState(cb, val, cardEl) {
        if (cb.checked) {
            selectedEmails.add(val);
            cardEl.classList.add('selected');
        } else {
            selectedEmails.delete(val);
            cardEl.classList.remove('selected');
        }
        document.getElementById('selectedCount').innerText = selectedEmails.size;
    }

    function checkAllMobile(status) {
        const cards = document.querySelectorAll('.contact-card');
        cards.forEach(card => {
            const cb = card.querySelector('.card-checkbox');
            const val = cb.getAttribute('onclick').match(/'([^']+)'/)[1];
            cb.checked = status;
            if (status) {
                selectedEmails.add(val);
                card.classList.add('selected');
            } else {
                selectedEmails.delete(val);
                card.classList.remove('selected');
            }
        });
        document.getElementById('selectedCount').innerText = selectedEmails.size;
    }

    function loadTemplate(subj, body) {
        document.getElementById('mSubject').value = subj;
        document.getElementById('mBody').value = body;
    }

    function getRecipientsStr() {
        return Array.from(selectedEmails).join('; ');
    }

    function copyMobileRecipients() {
        const rec = getRecipientsStr();
        if (!rec) { alert('請先勾選聯絡人！'); return; }
        navigator.clipboard.writeText(rec).then(() => alert('已複製收件人名單！'));
    }

    function copyMobileFull() {
        const subj = document.getElementById('mSubject').value;
        const body = document.getElementById('mBody').value;
        navigator.clipboard.writeText(`主旨：${subj}\n\n${body}`).then(() => alert('已複製完整內容！'));
    }

    function sendMobileEmail() {
        const rec = getRecipientsStr();
        if (!rec) { alert('請先勾選聯絡人！'); return; }
        const subj = encodeURIComponent(document.getElementById('mSubject').value);
        const body = encodeURIComponent(document.getElementById('mBody').value);
        window.location.href = `mailto:${rec}?subject=${subj}&body=${body}`;
    }
</script>
</body>
</html>
